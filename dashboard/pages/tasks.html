<!DOCTYPE html>
<!-- 文件用途：任务流转页 —— 新建任务（派单）、领单、推进一步、查看轨迹、关口决议、生成回报（F-04/F-05）。 -->
<!-- 对应需求：R-L3-04（文案生成/选择/流转/发布/数据五类操作可在页面完成）、R-L3-05（只调本地脚本）、R-L3-02（字段说明）、AC-3。 -->
<!-- 维护提示：页面按钮与 skill 的映射在 NEXT_STEP；新增环节先把映射补在这里，再到 _shared/console.py 的 RUN_WHITELIST 放行。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agentFrame 运营控制台 · 任务流转</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<script src="../assets/app.js"></script>
<script>
/* 区块：环节 → 下一步该找谁（与 agents/orchestrator/config.yml 的 stage_routing 保持一致） */
const NEXT_STEP = {
  copy:    ["copy-writer", "generate", []],
  visual:  ["reference-image-builder", "build", []],
  video:   ["asset-packager", "pack", []],
  publish: ["browser-publisher", "prepare", ["--account-label"]],
  metrics: ["metrics-collector", "collect", ["--fixture", "templates/mock/metrics.v1.json"]],
  review:  ["review-reporter", "report", []],
};
const STAGE_OPTIONS = [["", "全部环节"], ["copy", "文案"], ["visual", "视觉"], ["video", "视频"],
                       ["publish", "发布"], ["metrics", "指标"], ["review", "复盘"], ["closed", "收尾"]];
const STATUS_OPTIONS = [["", "全部状态"], ["pending", "待开始"], ["running", "进行中"],
                        ["waiting_human", "等人工"], ["blocked", "受阻"], ["done", "完成"], ["failed", "失败"]];
const filter = { stage: "", status: "", keyword: "" };
let selected = 0;

/* 区块：页面主体 */
async function render() {
  const snap = state.snapshot;
  if (!snap) return;
  const main = el("main", {},
    cardDispatch(), cardPanel(), cardList(snap), cardTrace());
  shell("tasks.html", main);
  renderList();
}

/* 区块：新建任务（派单） */
function cardDispatch() {
  const title = el("input", { id: "d-title", placeholder: "例：打工人春节返乡" });
  const platform = el("select", { id: "d-platform" }, ...["抖音", "小红书", "B站", "视频号"].map((p) => option(p)));
  const type = el("select", { id: "d-type" }, ...["情绪冲突", "干货教程", "热点观点", "其他"].map((t) => option(t)));
  const words = el("input", { id: "d-words", placeholder: "留空按平台模板（例 300-500）" });
  const prompt = el("textarea", { id: "d-prompt", placeholder: "对话框里的原始输入：想说什么、给谁看、什么情绪" });
  return el("div", { class: "card" },
    el("h2", {}, "新建任务（派单）", el("span", { class: "hint", text: "调 task-decomposer dispatch：建选题 + 建任务 + 出派单书（交接契约随书带出）" })),
    el("div", { class: "grid cols-2" },
      el("label", { class: "field" }, el("span", { text: "选题标题（必填）" }), title),
      el("label", { class: "field" }, el("span", { text: "目标平台（必填）" }), platform),
      el("label", { class: "field" }, el("span", { text: "内容类型" }), type),
      el("label", { class: "field" }, el("span", { text: "字数范围" }), words)),
    el("label", { class: "field" }, el("span", { text: "原始提示词（喂给文案写手）" }), prompt),
    el("div", { class: "row" }, el("button", { class: "primary", text: "派单建任务", onclick: async () => {
      if (!title.value.trim()) return toast("选题标题不能为空", true);
      const args = ["--title", title.value.trim(), "--platform", platform.value, "--content-type", type.value,
                    "--prompt", prompt.value.trim()];
      if (words.value.trim()) {
        const parts = words.value.split("-").map((x) => x.trim());
        if (parts.length === 2) args.push("--word-min", parts[0], "--word-max", parts[1]);
      }
      const out = await run("task-decomposer", "dispatch", args);
      if (out.json) { selected = out.json.task_id; toast(`已建任务 #${out.json.task_id}（派给 ${out.json.agent_name}）`); await refresh(); }
    } })),
    el("div", { class: "muted", text: "派单书会落在 workspace/topic-<选题号>/plan/，里面写明：进场校验什么、要交什么、什么算做完。" }));
}

/* 区块：操作面板（领单 / 推进 / 决议 / 回报） */
function cardPanel() {
  const taskId = el("input", { id: "p-task", placeholder: "任务号（点表格里的「选中」自动填）" });
  const actor = el("input", { id: "p-actor", value: "运营小李", placeholder: "操作人（真人标识，决议必填）" });
  const account = el("input", { id: "p-account", placeholder: "账号标签（只记标签，不存密码）" });
  const gate = el("select", { id: "p-gate" }, ...["gate1_select_copy", "gate2_edit_video", "gate3_publish_auth",
    "gate_visual_style", "gate_visual_fix"].map((g) => option(g)));
  const action = el("select", { id: "p-action" }, ...["confirm", "reject", "adjust"].map((a) => option(a)));
  const planNo = el("input", { id: "p-plan", placeholder: "套号（关口① confirm 必填 1~3）" });
  return el("div", { class: "card" },
    el("h2", {}, "操作面板", el("span", { class: "hint", text: "所有写操作都经本地服务调 skill，页面上不留任何账号凭据（R-L3-05）" })),
    el("div", { class: "grid cols-3" },
      el("label", { class: "field" }, el("span", { text: "任务号" }), taskId),
      el("label", { class: "field" }, el("span", { text: "操作人" }), actor),
      el("label", { class: "field" }, el("span", { text: "账号标签" }), account),
      el("label", { class: "field" }, el("span", { text: "关口" }), gate),
      el("label", { class: "field" }, el("span", { text: "关口动作" }), action),
      el("label", { class: "field" }, el("span", { text: "套号" }), planNo)),
    el("div", { class: "row" },
      el("button", { text: "领单（置进行中 + 记处理人）", onclick: () => call("artifact-recorder", "task-update",
        ["--task-id", pick(taskId), "--status", "running", "--operator", actor.value]) }),
      el("button", { class: "primary", text: "推进下一步", onclick: () => advance(pick(taskId), account.value) }),
      el("button", { text: "生成回报", onclick: () => call("summary-writer", "summarize", ["--task-id", pick(taskId)]) }),
      el("button", { text: "关口决议（写 hitl_events）", onclick: () => {
        const args = ["--task-id", pick(taskId), "--gate", gate.value, "--action", action.value, "--actor", actor.value];
        if (planNo.value.trim()) args.push("--plan-no", planNo.value.trim());
        return call("hitl-gate", "resolve", args);
      } }),
      el("button", { text: "看轨迹", onclick: () => showTrace(pick(taskId)) })),
    el("div", { class: "muted", text: "提示：关口① 选定文案请到「文案生成」页点选（会带上套号与内容快照），这里留给其它关口与退回。" }));
}

function pick(input) {
  const value = (input.value || selected || "").toString().trim();
  if (!value) { toast("先填任务号（或在表格里点「选中」）", true); throw new Error("no task"); }
  if (input.value === "") input.value = value;
  return value;
}

async function call(skill, action, args, then = true) {
  const out = await run(skill, action, args);
  if (then) await refresh();
  return out;
}

/* 区块：按环节推进一步 */
async function advance(taskId, accountLabel) {
  const row = (state.snapshot.tasks || []).find((t) => String(t.id) === String(taskId));
  if (!row) return toast(`找不到任务 #${taskId}`, true);
  const [skill, action, extra] = NEXT_STEP[row.stage] || [];
  if (!skill) return toast(`环节 ${row.stage} 没有自动下一步（请人工处理）`, true);
  if (extra.includes("--account-label") && accountLabel) extra.push(accountLabel);
  return call(skill, action, ["--task-id", String(taskId), ...extra]);
}

/* 区块：任务清单 */
function cardList(snap) {
  const stageSel = el("select", { id: "f-stage", onchange: (e) => { filter.stage = e.target.value; renderList(); } },
    ...STAGE_OPTIONS.map(([v, t]) => option(v, t)));
  const statusSel = el("select", { id: "f-status", onchange: (e) => { filter.status = e.target.value; renderList(); } },
    ...STATUS_OPTIONS.map(([v, t]) => option(v, t)));
  const kw = el("input", { id: "f-kw", placeholder: "按选题标题 / 关键词过滤", oninput: (e) => { filter.keyword = e.target.value; renderList(); } });
  return el("div", { class: "card" },
    el("h2", {}, "任务清单", el("span", { class: "hint", text: "字段：任务 / 选题 / 平台 / 环节 / 状态 / 步骤数 / 失败步骤 / 产物数 / 最后技能 / 处理人" })),
    el("div", { class: "grid cols-3" }, stageSel, statusSel, kw),
    el("div", { id: "task-table", style: "margin-top:12px" }));
}

function renderList() {
  const tasks = (state.snapshot.tasks || []).filter((t) => {
    if (filter.stage && t.stage !== filter.stage) return false;
    if (filter.status && t.status !== filter.status) return false;
    if (filter.keyword) {
      const hay = `${t.topic_title || ""} ${t.topic_keywords || ""} ${t.id}`.toLowerCase();
      if (!hay.includes(filter.keyword.toLowerCase())) return false;
    }
    return true;
  });
  const box = $("#task-table");
  if (!box) return;
  box.replaceChildren(table(
    ["任务", "选题", "平台", "环节", "状态", "步骤", "产物", "最后技能", "处理人", "操作"],
    tasks.map((t) => [
      el("div", {}, el("b", { text: `#${t.id}` }), el("div", { class: "sub", text: t.content_type || "—" })),
      el("div", {}, t.topic_title || "—", el("div", { class: "sub", text: t.topic_keywords || "" })),
      t.target_platform || "—",
      stageTag(t.stage),
      el("div", {}, statusTag(t.status),
        el("div", { class: "sub", text: `${t.step_count} 步 / ${t.failed_steps} 失败` })),
      t.step_count, t.artifact_count, t.last_skill || "—", t.operator || "—",
      el("div", { class: "row" },
        el("button", { text: "选中", onclick: () => { selected = t.id; const box2 = $("#p-task"); if (box2) box2.value = t.id; toast(`已选中任务 #${t.id}`); } }),
        el("button", { text: "轨迹", onclick: () => showTrace(t.id) }),
        el("button", { text: "推进", onclick: () => advance(t.id) })),
    ]), "没有符合条件的任务"));
}

/* 区块：任务轨迹面板 */
function cardTrace() {
  return el("div", { class: "card" }, el("h2", {}, "任务轨迹", el("span", { class: "hint", text: "步骤流水 / 产物 / 关口事件，直接读库（只读）" })),
    el("div", { id: "trace" }, el("div", { class: "muted", text: "还没有选任务" })));
}

async function showTrace(taskId) {
  const box = $("#trace");
  try {
    const data = await get(`/api/task?id=${taskId}`);
    box.replaceChildren(
      el("h3", { text: `#${taskId} ${data.task.topic_title || ""} · ${data.task.stage_label} / ${data.task.status_label}` }),
      el("div", { class: "grid cols-2" },
        el("div", {}, el("h4", { text: "步骤流水" }), table(["#", "技能", "状态", "适配器", "时间"],
          (data.steps || []).map((s) => [s.step_no, s.skill_id, s.status, s.adapter_used || "—", timeText(s.started_at)]))),
        el("div", {}, el("h4", { text: "产物" }), table(["#", "类型", "角色", "路径", "模型/提示词"],
          (data.artifacts || []).map((a) => [a.id, a.kind, a.role || "—",
            el("span", { class: "mono", text: a.path }), `${a.model_version || "—"} / ${a.prompt_version || "—"}`])))),
      el("div", { class: "grid cols-2" },
        el("div", {}, el("h4", { text: "关口事件" }), table(["关口", "动作", "谁", "时间"],
          (data.gates || []).map((g) => [g.gate_label, g.action, g.actor, timeText(g.created_at)]))),
        el("div", {}, el("h4", { text: "指标 / 发布" }), table(["项目", "值"],
          [...(data.metrics || []).map((m) => [`${m.period_start} ${m.platform} ${m.metric_key}`, m.value]),
           ...(data.publishes || []).map((p) => [`发布 ${p.platform} ${p.status}`, p.publish_url || "未回填"])]))));
  } catch (err) {
    box.replaceChildren(el("div", { class: "tag bad", text: err.message }));
  }
}

async function refresh() {
  state.snapshot = await get("/api/snapshot");
  renderList();
}

boot(render);
</script>
</body>
</html>
